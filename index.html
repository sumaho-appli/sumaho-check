<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b8432f">
<meta name="description" content="はい・いいえで答えるだけ。わが家のスマホ・SNSの「守る」「備える」がわかる1分チェック">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="/sumaho-check/icons/icon-192.png">
<link rel="apple-touch-icon" href="/sumaho-check/icons/apple-touch-icon.png">

<title>わが家のスマホ・SNS 1分チェック</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7f0; --card:#ffffff; --ink:#2b2a28; --sub:#6b665e;
    --mamoru:#b8432f; --junbi:#5a62a8; --sonae:#2f7d6d; --accent:#f2b134; --line:#e8e1d4; --off:#b3ab9d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"M PLUS Rounded 1c",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
  .app{width:100%;max-width:440px;height:100dvh;display:flex;flex-direction:column;padding:14px 16px 10px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px}
  header h1{font-size:14px;font-weight:800;white-space:nowrap}
  header h1 span{color:var(--mamoru)}
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px}
  .seg button{border:none;background:none;font:inherit;font-size:12px;font-weight:700;color:var(--sub);padding:6px 9px;border-radius:99px;cursor:pointer}
  .seg button.on{background:var(--ink);color:#fff}
  .bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
  .screen{animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* start */
  .hero{text-align:center}
  .hero .big{font-size:52px;line-height:1}
  .pick{font-size:15px;font-weight:800;margin-bottom:8px}
  .grades{display:flex;gap:8px}
  .gbtn{flex:1;border:none;border-radius:16px;background:var(--ink);color:#fff;font:inherit;font-size:11px;line-height:1.3;padding:12px 0 10px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .gbtn b{display:block;font-size:20px;font-weight:800;margin:2px 0}
  .gbtn small{font-size:11px;opacity:.75}
  .pnote{font-size:11px;color:var(--sub);margin-top:10px;line-height:1.5}
  .who{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:#fff;background:var(--ink);border-radius:99px;padding:3px 12px}
  .hero h2{font-size:23px;font-weight:800;margin:8px 0 14px;line-height:1.4}
  .parts{display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:18px}
  .part{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .part .pl{flex:none;font-size:15px;font-weight:800;color:#fff;border-radius:10px;padding:8px 10px}
  .part.m .pl{background:var(--mamoru)} .part.s .pl{background:var(--sonae)}
  .part b{font-size:14px;display:block}
  .part small{font-size:12px;color:var(--sub);line-height:1.5}

  /* part intro */
  .intro{text-align:center}
  .intro .no{font-size:13px;font-weight:700;color:var(--sub)}
  .intro .ttl{display:inline-block;font-size:34px;font-weight:800;color:#fff;border-radius:18px;padding:10px 28px;margin:10px 0 14px}
  .intro.m .ttl{background:var(--mamoru)} .intro.s .ttl{background:var(--sonae)}
  .intro h2{font-size:19px;font-weight:800;line-height:1.5;margin-bottom:10px}
  .intro p{font-size:14px;color:var(--sub);line-height:1.75;margin-bottom:24px}

  /* question */
  .qno{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:10px}
  .pill{font-size:11px;font-weight:800;color:#fff;border-radius:99px;padding:3px 9px}
  .pill.m{background:var(--mamoru)} .pill.s{background:var(--sonae)}
  .q{font-size:21px;font-weight:800;line-height:1.5}
  .hint{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.6}
  .btns{display:flex;gap:12px;margin-top:26px}
  .btn{flex:1;border:none;border-radius:18px;padding:20px 0;font:inherit;font-size:20px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .btn.y{background:#3a6ea5} .btn.n{background:#8a8378}
  .btn.go{background:var(--ink);font-size:18px;padding:17px 0;width:100%}
  .intro.m .btn.go{background:var(--mamoru)} .intro.s .btn.go{background:var(--sonae)}
  .back{background:none;border:none;font:inherit;font-size:13px;color:var(--sub);margin-top:16px;cursor:pointer;align-self:flex-start}

  /* result */
  .rows{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
  .rrow{display:flex;gap:8px;align-items:flex-start}
  .rlab{flex:none;width:64px;font-size:12px;font-weight:800;color:#fff;border-radius:8px;padding:4px 0;text-align:center;line-height:1.3}
  .rlab small{display:block;font-size:11px;font-weight:700;opacity:.9}
  .rrow.m .rlab{background:var(--mamoru)} .rrow.p .rlab{background:var(--junbi)}
  .rrow.p .sh.ng{border-color:var(--junbi);color:var(--junbi)} .rrow.p .sh.ng.cur{background:var(--junbi);color:#fff}
  .res.p{border-top-color:var(--junbi)} .res.p .tag{background:var(--junbi)} .res.p li::before{background:var(--junbi)} .pill.p{background:var(--junbi)} .rrow.s .rlab{background:var(--sonae)}
  .chips{display:flex;gap:4px;flex-wrap:wrap}
  .sh{font:inherit;font-size:11px;font-weight:700;border-radius:8px;padding:3px 7px;border:1.5px solid var(--line);background:#fff;color:var(--off)}
  .sh.ng{cursor:pointer}
  .rrow.m .sh.ng{border-color:var(--mamoru);color:var(--mamoru)}
  .rrow.s .sh.ng{border-color:var(--sonae);color:var(--sonae)}
  .rrow.m .sh.ng.cur{background:var(--mamoru);color:#fff}
  .rrow.s .sh.ng.cur{background:var(--sonae);color:#fff}
  .tip{font-size:11px;color:var(--sub);margin:2px 0 8px}
  .res{background:var(--card);border-radius:18px;border:1px solid var(--line);border-top:5px solid var(--ink);padding:13px 15px 11px}
  .res.m{border-top-color:var(--mamoru)} .res.s{border-top-color:var(--sonae)}
  .tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:99px;padding:3px 10px;background:var(--accent)}
  .res.m .tag{background:var(--mamoru)} .res.s .tag{background:var(--sonae)}
  .res h2{font-size:18px;font-weight:800;line-height:1.45;margin:7px 0 4px}
  .res .why{font-size:13px;color:var(--sub);line-height:1.55;margin-bottom:8px}
  .res .lead{font-size:12px;font-weight:800;margin-bottom:5px}
  .res ol{list-style:none;counter-reset:n;display:flex;flex-direction:column;gap:6px}
  .res li{counter-increment:n;font-size:14px;line-height:1.5;display:flex;gap:9px;align-items:flex-start}
  .res li::before{content:counter(n);flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .res.m li::before{background:var(--mamoru)} .res.s li::before{background:var(--sonae)}
  .res .note{margin-top:9px;font-size:12px;background:#fdf1e7;border-radius:10px;padding:6px 10px;line-height:1.55;color:#7a4a2f}
  .row{display:flex;gap:10px;margin-top:9px}
  .nav{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
  .nav button{font:inherit;font-weight:800;border:none;border-radius:12px;cursor:pointer}
  .nav .pv{width:42px;padding:11px 0;background:#f1ece3;color:var(--ink);font-size:16px}
  .nav .pv:disabled{opacity:.35;cursor:default}
  .nav .cnt{font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap}
  .nav .nx{flex:1;padding:12px 6px;font-size:14px;color:#fff;background:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.15);animation:nudge 1.6s ease-in-out 1s 2}
  .res.m .nav .nx{background:var(--mamoru)} .res.s .nav .nx{background:var(--sonae)} .res.p .nav .nx{background:var(--junbi)}
  .nav .nx.done{background:#8a8378!important;animation:none}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  .sm{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
  .send{display:block;width:100%;border:none;font:inherit;cursor:pointer;text-align:center;text-decoration:none;margin-top:9px;background:var(--accent);color:#fff;border-radius:12px;padding:12px 0;font-size:15px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .send:disabled{opacity:.7;cursor:default}
  .send.demo{background:#eee9df;color:var(--sub);box-shadow:none;font-size:13px}
  .demo-tag{font-size:11px;font-weight:700;color:#fff;background:var(--sub);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
  .send.done{background:#e6f2ee;color:var(--sonae);box-shadow:none;font-size:14px}
  .opinion{display:block;text-align:center;font-size:12px;color:var(--sub);margin-top:6px}
  footer{font-size:10px;color:var(--sub);text-align:center;line-height:1.5;padding-top:6px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 14px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>

    {k:"consult",...COMMON.consult}

  nophone:{
    yes:{tag:"持たせる前のご家庭へ",t:"「渡す前」が、いちばんのチャンスです",w:"ルールは後から足すより、最初に決めておく方がずっと守りやすくなります。",lead:"渡す前にやること",

const BETA = (()=>{ try{ return /\/beta\//.test(location.pathname); }catch(e){ return false; } })();

let sent=false;
function sendAnswers(btn){
  const url=formUrl(); if(!url) return;
  btn.disabled=true; btn.textContent="送信中…";
  const q=url.split("?")[1];
  const body=new URLSearchParams(q); body.delete("usp");
  fetch(FORM.base.replace(/viewform$/,"formResponse"),{method:"POST",mode:"no-cors",body})
    .then(()=>{ sent=true; render(); })
    .catch(()=>{ btn.disabled=false; btn.textContent="送信できませんでした。もう一度押してください"; });
}
function formUrl(){
  if(!FORM.base) return "";
  const p=new URLSearchParams({usp:"pp_url"});
  const set=(k,v)=>{ if(FORM.entry[k]) p.append("entry."+FORM.entry[k],v); };
  set("mode", {l:"低学年",e:"高学年",j:"中学生"}[mode]);
  if("np" in ans){
    set("own","持っていない"); set(D().planKey, ans.np?"ある":"ない");
    PREP.forEach(x=>{ if(x.k in ans) set(x.k, x.score===false ? (ans[x.k]?"ある":"あまりない") : (ans[x.k]?"はい":"まだ")); });
  }
  else{
    set("own","持っている");
    D().items.forEach(x=>{ if(x.k in ans) set(x.k, ans[x.k]?"はい":"まだ"); });
  }
  return FORM.base+"?"+p.toString();
}

    const x=PREP[step.i];
    setBar((step.i+2)/(PREP.length+2));
    qScreen("p",`${step.i+3} / ${PREP.length+2}`,x.t,x.h,x.yl||"はい",x.nl||"まだ",`prepAns(${step.i},true)`,`prepAns(${step.i},false)`);
    return;
  }
  if(step.v==="presult"){ setBar(1); presult(step.focus); return; }
  if(step.v==="intro"){
    const P=PART[step.p], no=step.p==="m"?"第1部":"第2部";
    setBar(step.p==="m"?.05:(ofPart("m").length+1)/(total+2));
    $("main").innerHTML=`<div class="screen intro ${step.p}">
      <div class="no">${no}</div>
      <div class="ttl">${P.name}</div>
      <h2>${P.h}</h2>
      <p>${P.p}</p>
      <button class="btn go" onclick="next()">${P.sub}を確認する</button>
      <div><button class="back" onclick="pop()">← ひとつ戻る</button></div>
    </div>`;
    return;
  }
  if(step.v==="q"){
    const it=d.items.find(x=>x.k===step.k), list=ofPart(it.part), idx=list.indexOf(it), P=PART[it.part];
    const done=d.items.indexOf(it)+(it.part==="s"?2:1);
    setBar(done/(total+2));
    qScreen(it.part,`${idx+1} / ${list.length}`,it.t,it.h,P.yes,P.no,`answer('${it.k}',true)`,`answer('${it.k}',false)`);
    return;
  }
  if(step.v==="result"){ setBar(1); result(step.focus); }
}
function qScreen(part,no,t,h,yl,nl,yes,nn){
  const pill=part?`<span class="pill ${part}">${part==="p"?"準備":PART[part].name}</span>`:"";
  $("main").innerHTML=`<div class="screen" style="display:flex;flex-direction:column">
    <div class="qno">${pill}${no}</div><div class="q">${t}</div>${h?`<div class="hint">${h}</div>`:""}
    <div class="btns"><button class="btn y" onclick="${yes}">${yl}</button><button class="btn n" onclick="${nn}">${nl}</button></div>
    <button class="back" onclick="pop()">← ひとつ戻る</button></div>`;
}
/* 次の画面へ（seq上で現在位置の次） */
function next(){
  const S=seq(), cur=path[path.length-1];
  let i=-1;
  if(cur && cur.v==="intro") i=S.findIndex(s=>s.v==="intro"&&s.p===cur.p);
  else if(cur && cur.v==="q") i=S.findIndex(s=>s.v==="q"&&s.k===cur.k);
  push({...S[i+1]});
}
function answer(k,v){ans[k]=v;next()}
function npAns(v){ans.np=v;push({v:"pq",i:0})}
function prepAns(i,v){ans[PREP[i].k]=v; push(i+1<PREP.length?{v:"pq",i:i+1}:{v:"presult"})}
function presult(focus){
  const list=prepScored(), ng=list.filter(x=>!ans[x.k]).map(x=>x.k), cur=focus||ng[0];
  const chips=list.map(x=>ans[x.k]
    ? `<span class="sh">✓ ${x.s}</span>`
    : `<button class="sh ng ${x.k===cur?'cur':''}" onclick="setFocus('${x.k}')">✕ ${x.s}</button>`).join("");
  const head=`<div class="rows"><div class="rrow p"><div class="rlab">準備<small>${list.length-ng.length} / ${list.length}</small></div><div class="chips">${chips}</div></div></div>
    ${ng.length>1?`<div class="tip">まだの <b>${ng.length}つ</b> の準備を、下で順番に確認できます</div>`:''}`;
  if(!cur){ card(D().nophone[ans.np?"yes":"no"],head,"p",false); return; }
  card(list.find(x=>x.k===cur).adv,head,"p",cur===ng[0],navHtml(ng,cur));
}
function result(focus){
  const d=D();
  const ngM=ofPart("m").filter(x=>!ans[x.k]).map(x=>x.k);
  const ngS=ofPart("s").filter(x=>!ans[x.k]).map(x=>x.k);
  const cur=focus||ngM[0]||ngS[0];
  const row=p=>{
    const list=ofPart(p), ok=list.filter(x=>ans[x.k]).length;
    const chips=list.map(x=>ans[x.k]
      ? `<span class="sh">✓ ${x.s}</span>`
      : `<button class="sh ng ${x.k===cur?'cur':''}" onclick="setFocus('${x.k}')">✕ ${x.s}</button>`).join("");
    return `<div class="rrow ${p}"><div class="rlab">${PART[p].name}<small>${ok} / ${list.length}</small></div><div class="chips">${chips}</div></div>`;
  };
  const ng=[...ngM,...ngS];
  const head=`<div class="rows">${row("m")}${row("s")}</div>
    ${ng.length>1?`<div class="tip">できていない <b>${ng.length}つ</b> の対策を、下で順番に確認できます</div>`:''}`;
  if(!cur){
    card({tag:"すばらしい！",t:"わが家の「守る」も「備える」も万全です",w:"ここまでできているご家庭は、ぜひ周りにも広げてください。",lead:"次のステップ",
      a:["成長に合わせて、話し合いの内容を見直す","大人も食事中・会話中はスマホを置く","このチェックを、ほかの保護者にも紹介する"],n:""},head,"");
    return;
  }
  const it=d.items.find(x=>x.k===cur);
  const first = cur===(ngM[0]||ngS[0]);
  card(it.adv,head,it.part,first,navHtml(ng,cur));
}
function setFocus(k){path[path.length-1].focus=k;render()}
/* できていない項目を順番にめくるナビ */
function navHtml(ng,cur){
  if(ng.length<2) return "";
  const i=ng.indexOf(cur), prev=ng[i-1], next=ng[i+1], left=ng.length-1-i;
  return `<div class="nav">
    <button class="pv" ${prev?`onclick="setFocus('${prev}')"`:"disabled"}>←</button>
    <span class="cnt">${i+1} / ${ng.length}</span>
    ${next?`<button class="nx" onclick="setFocus('${next}')">次の対策へ（あと${left}つ）→</button>`
          :`<button class="nx done" onclick="setFocus('${ng[0]}')">最初の対策に戻る ↺</button>`}
  </div>`;
}
function card(r,head,part,first,nav){
  const pre = ({m:"守る｜",s:"備える｜",p:"準備｜"})[part]||"";
  $("main").innerHTML=`<div class="screen">
    ${head||""}
    <div class="res ${part||""}">
      <span class="tag">${first?"まずはここから｜":""}${pre}${r.tag}</span>
      <h2>${r.t}</h2><p class="why">${r.w}</p>
      ${r.lead?`<div class="lead">${r.lead}</div>`:""}
      <ol>${r.a.map(x=>`<li><span>${x}</span></li>`).join("")}</ol>
      ${r.n?`<div class="note">${r.n}</div>`:""}
      ${nav||""}
    </div>
    ${DEMO?`<div class="send demo">${BETA?"β版":"お試しモード"}：回答は送信されません</div>`:formUrl()?(sent
      ? `<div class="send done">✓ 送信しました。ご協力ありがとうございます</div>
         <a class="opinion" href="${formUrl()}" target="_blank" rel="noopener">ご意見・わかりにくかった点を書く（任意）</a>`
      : `<button class="send" onclick="sendAnswers(this)">📮 回答を送る（無記名・ワンタップ）</button>`):""}
    <div class="row"><button class="sm" onclick="restart()">↺ もう一度</button><button class="sm" onclick="share()">🔗 リンクをコピー</button></div>
  </div>`;
}
function push(s){path.push(s);render()}
function pop(){path.pop();render()}
function restart(){path=[];ans={};sent=false;render()}
function share(){
  const fail=()=>toast("コピーできませんでした。画面上部のURLを共有してください");
  try{navigator.clipboard.writeText(location.href).then(()=>toast("リンクをコピーしました"),fail)}catch(e){fail()}
}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
setMode("l");
if(DEMO){ document.querySelector("header h1").insertAdjacentHTML("beforeend",`<span class="demo-tag">${BETA?"β版":"お試し"}</span>`); }
if(!BETA && "serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
